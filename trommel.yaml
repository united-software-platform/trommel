# Контракты намерения репозитория Trommel: какая норма здесь действует.
#
# Состав задаётся вычитанием — в него входят все правила каталога rules/, кроме явно
# исключённых. Правило, добавленное в норму, попадает в прогон само; исключение
# требует обоснования и остаётся видимым в вердикте.
version: 1
rules: rules

contracts:
  # Документация репозитория: первая группа, вводимая в зелёную зону.
  docs:
    exclude:
      - rule: CLAR
        reason: предметом проверки является исходный код, разбор кода ещё не реализован
      - rule: CQRS
        reason: предметом проверки является исходный код, разбор кода ещё не реализован
      - rule: DDD
        reason: предметом проверки является исходный код, разбор кода ещё не реализован
      - rule: GIT
        reason: предмет — действие, а не артефакт; проверяется хуками вне Trommel
      - rule: READ
        reason: предмет — обращение агента к файлу; вне области файлового прогона

  # Полный состав: всё, что объявлено нормой, без исключений.
  #
  # Состав среза фактов о коде объявлен здесь: правила предметной области принадлежат
  # этому контракту, и когда у них появятся реализации, срез будет готов. Пока таких
  # реализаций нет, подготовка не выполняется, а объявленный состав виден в вердикте
  # неиспользованным — обещание, за которое ещё никто не заплатил прогоном.
  full:
    facts: [L1, L2, L3, L4, L5, deps]

# Причины, по которым правило не проверяется Trommel. Это суждение проекта о собственной
# норме, а не знание инструмента: он лишь переносит причину в сводку покрытия рядом
# с состоянием правила. На прогон записи не влияют.
